{% extends "layout.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<h2>Edit Profile</h2>
<form method="post" style="max-width:480px">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Save</button>
  <a href="{% url 'profile_detail' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
