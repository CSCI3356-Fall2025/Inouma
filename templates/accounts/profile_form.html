{% extends "layout.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}

{% if request.GET.new %}
<div id="welcome-popup" class="popup-overlay">
  <div class="popup-content">
    <h2>Welcome to Inouma</h2>
    <p>Let's create your profile!</p>
    <button id="popup-close">Get Started</button>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const popup = document.getElementById("welcome-popup");
    const closeBtn = document.getElementById("popup-close");
    if (popup) {
      popup.style.display = "flex";
      closeBtn.addEventListener("click", () => popup.style.display = "none");
    }
  });
</script>

<style>
  .popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(44, 44, 44, 0.6);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    z-index: 2000;
}
  .popup-content {
    background: var(--white);
    border: 2px solid rgba(44, 44, 44, 0.1);
    border-radius: 16px;
    padding: 2rem 3rem;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    max-width: 500px;
    width: 90%;
    animation: popupFade 0.3s ease;
}

@keyframes popupFade {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.popup-content h2 {
    color: var(--maroon);
    margin-bottom: 0.75rem;
    font-size: 1.6rem;
}

.popup-content p {
    font-size: 1rem;
    color: var(--dark);
    margin-bottom: 1.5rem;
    line-height: 1.6;
}

#popup-close {
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1.5rem;
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
}

#popup-close:hover {
    background: rgb(226, 180, 61);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(246, 200, 81, 0.3);
}

.popup-overlay.active {
    display: flex;
}
</style>
{% endif %}

<h2>Edit Profile</h2>
<form method="post" style="max-width:480px">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Save</button>
  <a href="{% url 'profile_detail' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
