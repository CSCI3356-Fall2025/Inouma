<!-- Duplicate Machine Warning Modal -->
<div id="duplicateWarningModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h2 style="color: var(--maroon);">⚠️ Duplicate Machine Detected</h2>
            <button class="close-btn" onclick="closeDuplicateModal()">×</button>
        </div>
        <div style="padding: 1.5rem;">
            <p id="duplicateMessage" style="margin-bottom: 1.5rem; line-height: 1.6;"></p>
            
            <div class="form-group">
                <label>Change Identifier (Optional)</label>
                <input type="text" id="newIdentifier" placeholder="Enter new identifier" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px;">
                <small style="color: #666;">Leave blank to keep current identifier</small>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-primary" onclick="submitWithDuplicate()" style="flex: 1;">
                    Submit Anyway
                </button>
                <button class="btn btn-secondary" onclick="changeIdentifier()" style="flex: 1;">
                    Change Identifier
                </button>
                <button class="btn btn-secondary" onclick="closeDuplicateModal()">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
